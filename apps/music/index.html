<div class="music-app">
  <div class="music-layout">
    <section class="music-now" aria-label="Now playing">
      <!-- the current song's cover as a picture-disc record, spinning while it plays -->
      <div class="music-deck">
        <div class="music-disc">
          <img class="music-disc-art" alt="" draggable="false">
        </div>
      </div>

      <div class="music-info" aria-live="polite">
        <p class="music-title"></p>
        <p class="music-artist"></p>
      </div>

      <div class="music-progress">
        <input class="music-range music-seek" type="range" min="0" max="0" step="any" value="0" aria-label="Seek">
        <span class="music-time music-time-current">0:00</span>
        <span class="music-time music-time-total">0:00</span>
      </div>

      <div class="music-transport">
        <div class="music-controls">
          <button type="button" class="music-btn music-toggle music-shuffle" aria-label="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>
          <button type="button" class="music-btn music-prev" aria-label="Previous song">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button type="button" class="music-btn music-play" aria-label="Play">
            <svg class="music-icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg>
            <svg class="music-icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button type="button" class="music-btn music-next" aria-label="Next song">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button type="button" class="music-btn music-toggle music-repeat" aria-label="Repeat: off" aria-pressed="false" data-mode="off">
            <svg class="music-icon-repeat" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <svg class="music-icon-repeat-one" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
          </button>
        </div>

        <div class="music-volume">
          <button type="button" class="music-btn music-mute" aria-label="Mute">
            <svg class="music-icon-volume" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg class="music-icon-muted" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input class="music-range music-volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
      </div>

      <p class="music-error" role="alert" hidden></p>
    </section>

    <ol class="music-list" aria-label="Songs"></ol>
  </div>

  <!-- nothing downloads until play is pressed; then the browser streams it -->
  <audio class="music-audio" preload="none"></audio>
</div>
