<div class="browser-app">
  <div class="browser-toolbar">
    <button type="button" class="browser-home" aria-label="Home">⌂</button>
    <button type="button" class="browser-reload" aria-label="Reload">⟳</button>
    <input type="text" class="browser-address" aria-label="Address or search" autocomplete="off" spellcheck="false" />
    <button type="button" class="browser-go" aria-label="Go">➜</button>
  </div>
  <iframe class="browser-frame" title="Browser content" referrerpolicy="no-referrer"></iframe>
</div>
