<div class="paint-app">
  <div class="paint-toolbar">
    <input type="color" class="paint-color" value="#000000" aria-label="Color">
    <button type="button" class="paint-save">Save</button>
    <span class="paint-status"></span>
  </div>

  <div class="paint-body">
    <div class="paint-toolbox" role="toolbar" aria-label="Tools">
      <button type="button" class="paint-tool is-active" data-tool="select-rect" title="Rectangular Select" aria-label="Rectangular Select">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" stroke-dasharray="2.5 2"/></svg>
      </button>
      <button type="button" class="paint-tool" data-tool="select-lasso" title="Free-Form Select" aria-label="Free-Form Select">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><path d="M4 8 C4 4 8 3 11 4 C15 5 17 8 15 11 C17 13 14 17 10 16 C6 17 3 13 4 10 Z" stroke-dasharray="2 2"/></svg>
      </button>

      <button type="button" class="paint-tool" data-tool="eraser" title="Eraser" aria-label="Eraser">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><rect x="4" y="8" width="12" height="7" rx="1.2" transform="rotate(-20 10 11)"/><line x1="4" y1="17" x2="16" y2="17"/></svg>
      </button>
      <button type="button" class="paint-tool" data-tool="fill" title="Fill With Color" aria-label="Fill With Color">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><path d="M3 9 L10 3 L17 9 L10 15 Z"/><line x1="10" y1="15" x2="10" y2="18"/><circle cx="15" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg>
      </button>

      <button type="button" class="paint-tool" data-tool="eyedropper" title="Pick Color" aria-label="Pick Color">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><path d="M13 3 L17 7 L8 16 L4 17 L5 13 Z"/><line x1="11.5" y1="5.5" x2="14.5" y2="8.5"/></svg>
      </button>
      <button type="button" class="paint-tool" data-tool="zoom" title="Magnifier" aria-label="Magnifier">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.7" y1="12.7" x2="17" y2="17"/></svg>
      </button>

      <button type="button" class="paint-tool" data-tool="pencil" title="Pencil" aria-label="Pencil">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><path d="M4 16 L5 12 L13 4 L16 7 L8 15 Z"/><line x1="12" y1="5" x2="15" y2="8"/></svg>
      </button>
      <button type="button" class="paint-tool" data-tool="brush" title="Brush" aria-label="Brush">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><path d="M6 14 C4 16 4 18 3 18 C3 16 4 14 6 12 Z"/><path d="M6 12 L14 4 L16 6 L8 14 Z"/></svg>
      </button>

      <button type="button" class="paint-tool" data-tool="airbrush" title="Airbrush" aria-label="Airbrush">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><path d="M4 13 L9 8 L13 8 L13 10 L10 10 L6 14 Z"/><circle cx="14.5" cy="5.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="16.5" cy="8.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="15" cy="11.5" r="0.8" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" class="paint-tool" data-tool="text" title="Text" aria-label="Text">
        <span class="paint-tool-glyph">A</span>
      </button>

      <button type="button" class="paint-tool" data-tool="line" title="Line" aria-label="Line">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><line x1="4" y1="16" x2="16" y2="4"/></svg>
      </button>
      <button type="button" class="paint-tool" data-tool="curve" title="Curve" aria-label="Curve">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><path d="M3 14 C3 6 17 14 17 6"/></svg>
      </button>

      <button type="button" class="paint-tool" data-tool="rectangle" title="Rectangle" aria-label="Rectangle">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12"/></svg>
      </button>
      <button type="button" class="paint-tool" data-tool="polygon" title="Polygon" aria-label="Polygon">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><path d="M10 3 L17 8 L14 16 L6 16 L3 8 Z"/></svg>
      </button>

      <button type="button" class="paint-tool" data-tool="ellipse" title="Ellipse" aria-label="Ellipse">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="7" ry="5"/></svg>
      </button>
      <button type="button" class="paint-tool" data-tool="rounded-rect" title="Rounded Rectangle" aria-label="Rounded Rectangle">
        <svg class="paint-tool-icon" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="3.5"/></svg>
      </button>
    </div>

    <div class="paint-canvas-wrap">
      <div class="paint-canvas-stack">
        <canvas class="paint-canvas" width="480" height="320"></canvas>
        <!-- every tool's live preview draws here, never on .paint-canvas
             itself — see index.js's header comment -->
        <canvas class="paint-overlay" width="480" height="320"></canvas>
      </div>
    </div>
  </div>
</div>
