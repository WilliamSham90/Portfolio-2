<div class="calc-app">
  <div class="calc-display">
    <div class="calc-expression"></div>
    <div class="calc-result">0</div>
  </div>

  <div class="calc-pad">
    <button type="button" class="calc-btn calc-btn-fn" data-action="clear">AC</button>
    <button type="button" class="calc-btn calc-btn-fn" data-action="negate" aria-label="Toggle sign">&plusmn;</button>
    <button type="button" class="calc-btn calc-btn-fn" data-action="percent" aria-label="Percent">%</button>
    <button type="button" class="calc-btn calc-btn-op" data-op="&divide;" aria-label="Divide">&divide;</button>

    <button type="button" class="calc-btn calc-btn-num" data-digit="7">7</button>
    <button type="button" class="calc-btn calc-btn-num" data-digit="8">8</button>
    <button type="button" class="calc-btn calc-btn-num" data-digit="9">9</button>
    <button type="button" class="calc-btn calc-btn-op" data-op="&times;" aria-label="Multiply">&times;</button>

    <button type="button" class="calc-btn calc-btn-num" data-digit="4">4</button>
    <button type="button" class="calc-btn calc-btn-num" data-digit="5">5</button>
    <button type="button" class="calc-btn calc-btn-num" data-digit="6">6</button>
    <button type="button" class="calc-btn calc-btn-op" data-op="&minus;" aria-label="Subtract">&minus;</button>

    <button type="button" class="calc-btn calc-btn-num" data-digit="1">1</button>
    <button type="button" class="calc-btn calc-btn-num" data-digit="2">2</button>
    <button type="button" class="calc-btn calc-btn-num" data-digit="3">3</button>
    <button type="button" class="calc-btn calc-btn-op" data-op="+" aria-label="Add">+</button>

    <button type="button" class="calc-btn calc-btn-num calc-btn-zero" data-digit="0">0</button>
    <button type="button" class="calc-btn calc-btn-num" data-action="decimal" aria-label="Decimal point">.</button>
    <button type="button" class="calc-btn calc-btn-equals" data-action="equals" aria-label="Equals">=</button>
  </div>
</div>
