<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My OS</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./themes/fonts.css">
</head>
<body>

  <!-- ============================================================
       This file is ONLY the OS shell: the wallpaper canvas and the
       taskbar. Nothing app-specific belongs in here — the icon grid,
       every popup window, and every app's content are all fetched
       in and mounted by main.js at runtime. See README.md.
       ============================================================ -->

  <div id="desktop">

    <!-- js/wallpaper.js's chosen photo, painted over #desktop's own gradient -->
    <div id="desktop-wallpaper" aria-hidden="true"></div>

    <div id="desktop-canvas">
      <!-- widget/app-grid gets mounted here -->
      <div id="app-grid-root"></div>

      <!-- one widget/popup instance gets appended here per open app -->
      <div id="popup-layer"></div>
    </div>

    <nav id="taskbar">
      <!-- start-menu.js -->
      <button type="button" id="start-button" aria-label="Start menu" aria-haspopup="true">
        <img src="./assets/system/Icons/basic/home.png" alt="" draggable="false">
      </button>
      <div class="taskbar-divider" aria-hidden="true"></div>
      <!-- taskbar.js -->
      <div class="taskbar-tabs-wrap">
        <button type="button" class="taskbar-scroll taskbar-scroll-left" aria-label="Scroll tabs left" hidden>&lsaquo;</button>
        <!-- one .taskbar-tab button per open app (not per window — see "Taskbar tabs") -->
        <div id="taskbar-tabs"></div>
        <button type="button" class="taskbar-scroll taskbar-scroll-right" aria-label="Scroll tabs right" hidden>&rsaquo;</button>
      </div>
      <!-- clock-panel.js -->
      <button type="button" id="taskbar-clock-button" class="taskbar-clock-button" aria-haspopup="true">
        <span class="taskbar-clock-time"></span>
        <span class="taskbar-clock-date"></span>
      </button>
      <!-- notifications.js -->
      <button type="button" id="notification-history-button" class="taskbar-icon-button" aria-label="Notification history" aria-haspopup="true">
        <img src="./assets/system/Icons/basic/notification.png" alt="" draggable="false">
      </button>
    </nav>

  </div>

  <!-- notifications.js's toast, reused for whatever notification is
       currently showing — not specific to the welcome message, even
       though that's the only thing that fires one today -->
  <div id="notification-toast" class="notification-toast" hidden role="status">
    <button type="button" class="notification-toast-close" aria-label="Dismiss">&times;</button>
    <p class="notification-toast-title"></p>
    <p class="notification-toast-text"></p>
  </div>

  <!-- notifications.js's history dropdown -->
  <div id="notification-history-menu" class="notification-history-menu" hidden role="menu">
    <p class="notification-history-empty">No notifications yet.</p>
    <div class="notification-history-list"></div>
  </div>

  <!-- the OS's own right-click menu (context-menu.js). Shift+right-click
       always falls through to the browser's real one instead — see
       README.md > "Right-click menu" — so Inspect stays reachable. -->
  <ul id="context-menu" class="context-menu" role="menu" hidden></ul>

  <!-- themed replacement for window.confirm() (confirm-dialog.js) -->
  <div id="confirm-dialog" class="confirm-dialog" hidden>
    <div class="confirm-dialog-backdrop"></div>
    <div class="confirm-dialog-panel" role="alertdialog" aria-modal="true">
      <p class="confirm-dialog-message"></p>
      <div class="confirm-dialog-actions">
        <button type="button" class="confirm-dialog-cancel"></button>
        <button type="button" class="confirm-dialog-confirm"></button>
      </div>
    </div>
  </div>

  <!-- themed password prompt for unlocking apps/file-explorer's "Locked"
       folder (password-dialog.js) — shares its look with #confirm-dialog
       above, just with a password input + inline error added in -->
  <div id="password-dialog" class="confirm-dialog" hidden>
    <div class="confirm-dialog-backdrop"></div>
    <div class="confirm-dialog-panel" role="alertdialog" aria-modal="true">
      <p class="confirm-dialog-message"></p>
      <input type="password" class="password-dialog-input" autocomplete="off" spellcheck="false" aria-label="Password">
      <p class="password-dialog-error" hidden></p>
      <div class="confirm-dialog-actions">
        <button type="button" class="confirm-dialog-cancel">Cancel</button>
        <button type="button" class="confirm-dialog-confirm">Unlock</button>
      </div>
    </div>
  </div>

  <!-- taskbar.js's dropdown, listing each open window of a grouped app tab -->
  <div id="taskbar-group-menu" class="taskbar-group-menu" hidden role="menu"></div>

  <!-- start-menu.js's dropdown -->
  <div id="start-menu" class="start-menu" hidden role="menu">
    <div class="start-menu-apps"></div>
    <div class="start-menu-footer">
      <button type="button" class="start-menu-power">
        <img src="./assets/system/Icons/basic/power-button.png" alt="" draggable="false">
        <span>Power off</span>
      </button>
    </div>
  </div>

  <!-- clock-panel.js's slide-in time/date/calendar panel -->
  <div id="clock-panel" class="clock-panel" hidden>
    <div class="clock-panel-time"></div>
    <div class="clock-panel-date"></div>
    <div class="clock-panel-calendar">
      <div class="clock-panel-cal-header">
        <button type="button" class="clock-panel-cal-nav clock-panel-cal-prev" aria-label="Previous month">&#8249;</button>
        <span class="clock-panel-cal-month"></span>
        <button type="button" class="clock-panel-cal-nav clock-panel-cal-next" aria-label="Next month">&#8250;</button>
      </div>
      <div class="clock-panel-cal-grid"></div>
    </div>
  </div>

  <!-- clock-panel.js's click-to-reveal description for a holiday/birthday
       day — a sibling of #clock-panel, not nested inside it: that element
       gets a CSS transform for its slide animation, which would otherwise
       become this popup's containing block and break its fixed positioning -->
  <div id="clock-panel-day-popup" class="clock-panel-day-popup" hidden role="dialog">
    <p class="clock-panel-day-popup-text"></p>
  </div>

  <!-- power.js's shut-down/boot-up overlay -->
  <div id="power-overlay" class="power-overlay" hidden>
    <button type="button" class="power-on-button" aria-label="Power on" hidden>
      <img src="./assets/system/Icons/basic/power-button green.png" alt="" draggable="false">
    </button>
    <pre class="power-boot-log" hidden></pre>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
